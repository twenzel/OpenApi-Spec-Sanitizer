name: .NET
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build OpenApiSpecSanitizer.slnx --configuration Release
      - run: dotnet test OpenApiSpecSanitizer.slnx --configuration Release --no-build --logger trx
      - run: dotnet pack src/OpenApiSpecSanitizer/OpenApiSpecSanitizer.csproj --configuration Release --no-build --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/*.nupkg
